[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pavement"
version = "0.2.2"
description = "Quantile-based pavement plots for matplotlib, Bokeh, Plotly, and HoloViews."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Aaron Schumacher" }]
keywords = ["quantile", "boxplot", "visualization", "matplotlib", "bokeh",
            "plotly", "holoviews", "interactive", "statistics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = ["matplotlib>=3.5"]

[project.optional-dependencies]
test = ["pytest"]
# Each rendering backend is optional; matplotlib is the only hard
# dependency. The matching tests importorskip when the backend isn't
# installed, so the base `test` install exercises core + matplotlib only.
bokeh = ["bokeh>=3.0"]
plotly = ["plotly>=5.0"]
# HoloViews needs a newer Python than the base package's >=3.9 floor, so
# the all-backends CI job (and `pip install pavement[all]`) runs on a
# recent Python.
holoviews = ["holoviews>=1.15"]
# Every interactive backend at once, e.g. `pip install pavement[all]`.
all = ["pavement[bokeh,plotly,holoviews]"]

[project.urls]
Homepage = "https://github.com/ajschumacher/pavement"
Issues = "https://github.com/ajschumacher/pavement/issues"
Changelog = "https://github.com/ajschumacher/pavement/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/pavement"]

[tool.pytest.ini_options]
testpaths = ["tests"]

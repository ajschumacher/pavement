[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pavement"
version = "1.0.0rc1"
description = "Quantile-based pavement plots for matplotlib, Bokeh, Plotly, and HoloViews."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Aaron Schumacher" }]
keywords = ["quantile", "boxplot", "visualization", "matplotlib", "bokeh",
            "plotly", "holoviews", "interactive", "statistics"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Visualization",
]
# The core (quantiles, pavement_stats, pavement_stats2d) is pure Python
# with no third-party dependencies. Every rendering backend — matplotlib
# included — is an optional extra, so `pip install pavement[plotly]` does
# not pull in matplotlib.
dependencies = []

[project.optional-dependencies]
test = ["pytest"]
# Rendering backends. Each module importorskips its library in the tests,
# so a backend you don't install simply isn't exercised.
matplotlib = ["matplotlib>=3.5"]
bokeh = ["bokeh>=3.0"]
plotly = ["plotly>=5.0"]
# HoloViews needs a newer Python than the base package's >=3.9 floor, so
# the all-backends CI job (and `pip install pavement[all]`) runs on a
# recent Python.
holoviews = ["holoviews>=1.15"]
# Every backend at once, e.g. `pip install pavement[all]`.
all = ["pavement[matplotlib,bokeh,plotly,holoviews]"]
# Dataframe-library integrations (pavement.pandas / pavement.polars). The
# accessor modules import their library only when imported, so these are
# optional conveniences, not backends, and stay out of `all`.
pandas = ["pandas"]
polars = ["polars"]
# Documentation site (MkDocs Material + API docs auto-generated from docstrings).
# mkdocstrings reads the source statically, so the rendering backends are not
# required to build the docs.
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.26", "ruff"]

[project.urls]
Homepage = "https://planspace.org/pavement/"
Documentation = "https://planspace.org/pavement/"
Repository = "https://github.com/ajschumacher/pavement"
Issues = "https://github.com/ajschumacher/pavement/issues"
Changelog = "https://github.com/ajschumacher/pavement/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/pavement"]

[tool.pytest.ini_options]
testpaths = ["tests"]

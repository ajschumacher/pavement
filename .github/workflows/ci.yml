name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install ruff==0.15.13
      - run: ruff check src tests

  # Every backend across all supported Pythons. matplotlib, bokeh, and
  # plotly install everywhere, so they run on the whole matrix; HoloViews
  # has a higher Python floor and a heavier dependency stack, so the
  # per-version `extras` adds it only where it installs cleanly (3.10
  # through 3.13) — below the >=3.9 floor and on the newest Python its
  # deps may lack wheels. Each suite importorskips its backend, so a
  # version that omits `holoviews` simply skips that suite; installing the
  # extras explicitly (rather than relying on the skip) means an install
  # failure turns the job red instead of silently passing.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python-version: '3.9',  extras: 'matplotlib,bokeh,plotly' }
          - { python-version: '3.10', extras: 'all' }
          - { python-version: '3.11', extras: 'all' }
          - { python-version: '3.12', extras: 'all' }
          - { python-version: '3.13', extras: 'all' }
          - { python-version: '3.14', extras: 'matplotlib,bokeh,plotly' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[test,${{ matrix.extras }}]"
      - run: pytest

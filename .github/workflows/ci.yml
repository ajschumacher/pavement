name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install ruff==0.15.13
      - run: ruff check src tests

  # Core + matplotlib across all supported Pythons. The core itself has no
  # dependencies; matplotlib is installed here so its (largest) suite runs
  # broadly. The bokeh/plotly/holoviews suites importorskip here and are
  # covered by the all-backends job below.
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[test,matplotlib]'
      - run: pytest

  # Every backend together, so the bokeh/plotly/holoviews suites actually
  # run. On a recent Python, since HoloViews needs more than the >=3.9 floor.
  test-all-backends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e '.[test,all]'
      - run: pytest

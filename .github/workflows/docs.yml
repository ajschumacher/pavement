name: docs

# Build the MkDocs site and publish it to GitHub Pages on every push to main.
# Enable once under: repo Settings → Pages → Source → "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs for new pushes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The site is Markdown + docstrings only: mkdocstrings reads the source
      # statically (griffe), so the rendering backends are not needed here. The
      # live example embeds under docs/examples/assets/ are committed (regenerate
      # them with `python docs/gen_examples.py`).
      - run: pip install -e '.[docs]'
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
